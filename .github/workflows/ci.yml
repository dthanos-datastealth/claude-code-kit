name: ci

on:
  push:
    branches: [main, prerelease]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the CLAUDE.md upgrade test replays the real merge from
          # the previous version of the template, which it reads out of git. A
          # shallow clone makes it skip, and a gate that skips is not a gate.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest pytest-xdist

      # Pinned, not apt. The distro package moves independently of whatever a
      # developer has locally, and that skew hid a red CI for a month: a newer
      # local shellcheck stopped emitting two findings the runner's older build
      # still failed on, so `shellcheck` passed on every machine except this
      # one. Pinning makes a local run authoritative. Bump deliberately.
      - name: Install shellcheck (pinned)
        env:
          # Match what Homebrew currently ships, so the invariant in the
          # comment above actually holds. It did not: CI pinned v0.10.0 while
          # `brew install shellcheck` gave developers v0.11.0, which is the
          # same local-vs-CI skew the pin exists to prevent, just in the other
          # direction. Bump this when Homebrew moves, and check the local run
          # still passes first.
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck install.sh + uninstall.sh + scripts + plugin scripts
        run: |
          # plugins/ was omitted until fix-notion-mcp-port.sh had already
          # shipped a scope bug; it is shell the kit ships and runs, so it
          # belongs in the same sweep.
          shellcheck install.sh uninstall.sh scripts/*.sh \
                     plugins/claude-code-kit/scripts/*.sh

      - name: Run scrubbing lint on every tracked file
        run: python3 scripts/lint-scrubbing.py

      - name: Run tools-docs schema lint
        run: python3 scripts/lint-tools-docs.py docs/tools/*.md

      - name: Verify every plugin resolves against its upstream marketplace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/lint-plugin-marketplaces.py

      - name: Validate merge-policy.json schema
        run: python3 scripts/lint-merge-policy.py

      - name: Run pytest suite
        run: python3 -m pytest tests/ -q -n auto

      # Mutation testing: break the code on purpose, require the tests to
      # notice. A green suite says the code passes the tests; it does not say
      # the tests would fail if the code were wrong. Two tests in this repo
      # were written to cover two specific bugs, reviewed, and could not fail
      # for those bugs — the suite, the review and a whole-file revert all
      # reported them covered. See docs/verification-standards.md section 5.
      #
      # Runs after the suite because a surviving mutant is only meaningful
      # when the tests pass to begin with.
      - name: Mutation testing (every mutant must be killed)
        run: python3 scripts/mutate.py run-all

      # NOTE: lint-mcp-hardcoded-paths.py, lint-plugin-skill-layout.py and
      # scripts/test-upgrade-isolated.sh all need a populated plugin cache (an
      # actual install via the real `claude` CLI) and so are NOT in CI. In CI the
      # cache glob would match nothing and the lints would exit 0 vacuously.
      # They run locally:
      #   - scripts/test-install-isolated.sh — fresh-install path
      #   - scripts/test-upgrade-isolated.sh — upgrade path with simulated
      #     user state mutations + leak check + per-key preservation asserts
      # Documenting here so the gap is visible.
