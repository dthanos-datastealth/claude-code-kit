name: ci

on:
  push:
    branches: [main, prerelease]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the CLAUDE.md upgrade test replays the real merge from
          # the previous version of the template, which it reads out of git. A
          # shallow clone makes it skip, and a gate that skips is not a gate.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      # Pinned, not apt. The distro package moves independently of whatever a
      # developer has locally, and that skew hid a red CI for a month: a newer
      # local shellcheck stopped emitting two findings the runner's older build
      # still failed on, so `shellcheck` passed on every machine except this
      # one. Pinning makes a local run authoritative. Bump deliberately.
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck install.sh + uninstall.sh + scripts
        run: |
          shellcheck install.sh uninstall.sh scripts/*.sh

      - name: Run scrubbing lint on claude/CLAUDE.md
        run: python3 scripts/lint-scrubbing.py claude/CLAUDE.md

      - name: Run tools-docs schema lint
        run: python3 scripts/lint-tools-docs.py docs/tools/*.md

      - name: Verify every plugin resolves against its upstream marketplace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/lint-plugin-marketplaces.py

      - name: Validate merge-policy.json schema
        run: python3 scripts/lint-merge-policy.py

      - name: Run pytest suite
        run: python3 -m pytest tests/ -v

      # NOTE: lint-mcp-hardcoded-paths.py, lint-plugin-skill-layout.py and
      # scripts/test-upgrade-isolated.sh all need a populated plugin cache (an
      # actual install via the real `claude` CLI) and so are NOT in CI. In CI the
      # cache glob would match nothing and the lints would exit 0 vacuously.
      # They run locally:
      #   - scripts/test-install-isolated.sh — fresh-install path
      #   - scripts/test-upgrade-isolated.sh — upgrade path with simulated
      #     user state mutations + leak check + per-key preservation asserts
      # Documenting here so the gap is visible.
